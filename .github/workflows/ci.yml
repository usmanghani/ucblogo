name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: Unit tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/unit.xml
          if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deployment:
    name: Wait for Vercel deployment
    runs-on: ubuntu-latest
    timeout-minutes: 17
    outputs:
      preview: ${{ steps.wait.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: wait
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/wait-for-vercel.mjs`);
            await run({ github, context, core });

  vercel:
    name: Vercel deployment tests
    needs: deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test deployed UI and API routing
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deployment.outputs.preview }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
      - name: Verify live assistant credentials and streaming
        run: npm run test:live
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deployment.outputs.preview }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  gate:
    name: CI gate
    if: always()
    needs: [unit, browser, deployment, vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Require local and deployed checks
        env:
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          DEPLOYMENT: ${{ needs.deployment.result }}
          VERCEL: ${{ needs.vercel.result }}
        run: |
          test "$UNIT" = success
          test "$BROWSER" = success
          test "$DEPLOYMENT" = success
          test "$VERCEL" = success
